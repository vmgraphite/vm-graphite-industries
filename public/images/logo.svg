<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="pdf-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070" />
      <stop offset="35%" stop-color="#E5B242" />
      <stop offset="70%" stop-color="#C59635" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>

    <!-- White Glow Gradient -->
    <linearGradient id="pure-white-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="gold-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Group: Stylized Slashed VM Logo (matching PDF) -->
  <g transform="translate(15, 12)">
    <!-- Slashed V Left Bar -->
    <polygon points="0,0 16,0 28,48 12,48" fill="url(#pure-white-grad)" />
    <!-- Slashed V Right Bar -->
    <polygon points="22,0 38,0 26,48 10,48" fill="url(#pdf-gold-grad)" />
    
    <!-- Gap Separator -->
    
    <!-- Slashed M Left Leg -->
    <polygon points="46,0 60,0 52,48 38,48" fill="url(#pure-white-grad)" />
    <!-- Slashed M Peak -->
    <polygon points="62,0 76,0 68,26 54,26" fill="url(#pdf-gold-grad)" />
    <!-- Slashed M Right Leg -->
    <polygon points="78,0 94,0 84,48 68,48" fill="url(#pure-white-grad)" />
  </g>

  <!-- Subtitle: GRAPHITE INDUSTRIES (matching PDF spaced tracking) -->
  <g transform="translate(15, 72)">
    <text x="0" y="0" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="9" fill="#94A3B8" letter-spacing="4.5">GRAPHITE INDUSTRIES</text>
  </g>

  <!-- Divider Line -->
  <line x1="125" y1="18" x2="125" y2="68" stroke="url(#pdf-gold-grad)" stroke-width="1.5" opacity="0.6" />

  <!-- Typography Right Side: VM Graphite Industries LLP -->
  <g transform="translate(142, 38)">
    <text x="0" y="0" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="21" fill="#FFFFFF" letter-spacing="0.5">VM GRAPHITE</text>
    <text x="0" y="20" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="12" fill="url(#pdf-gold-grad)" letter-spacing="1.5">INDUSTRIES LLP</text>
    <text x="0" y="32" font-family="'Inter', sans-serif" font-weight="500" font-size="8.5" fill="#64748B" letter-spacing="0.8">A Complete Solution For Coating &amp; Metalizer</text>
  </g>
</svg>
